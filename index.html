<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locale Format Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&family=Noto+Sans+KR:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: a QA reference tool. Tabs on top (compare all / one language), sticky category rail on the left,
     sample values as copyable "specimen" buttons, invisible spaces made visible with coloured marks. */
  --bg: #f3f5f7;
  --surface: #ffffff;
  --ink: #15212d;
  --muted: #5b6876;
  --line: #dce2e8;
  --accent: #0e6870;
  --accent-ink: #ffffff;
  --accent-soft: #e0eff0;
  --specimen: #f7f9fa;
  --mark-nb: #f4cf63;
  --mark-nn: #c3b0f3;
  --mark-th: #9fd9bd;
  --shadow: 0 1px 2px rgba(21,33,45,.06), 0 4px 16px rgba(21,33,45,.05);
  --s-oth: #8b97a3; --s-lat: #2c6cd1; --s-hang: #c23f78; --s-kana: #d27a1f; --s-han: #6a4cc7; --bad: #b4382f; --bad-soft: #fbeceb;
  --f-display: "Anuphan", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Thai", "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --f-sample: "IBM Plex Sans", "IBM Plex Sans Thai", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e151b; --surface: #151f28; --ink: #e4ebf1; --muted: #93a1ae; --line: #253240;
    --accent: #5cc0c6; --accent-ink: #082024; --accent-soft: #16343a; --specimen: #1a2631;
    --mark-nb: rgba(244,207,99,.45); --mark-nn: rgba(170,145,240,.5); --mark-th: rgba(110,200,160,.45);
    --shadow: 0 1px 2px rgba(0,0,0,.3); --s-oth: #7d8995; --s-lat: #6fa2f0; --s-hang: #ec79a9; --s-kana: #f0a659; --s-han: #a58ef0; --bad: #f08a80; --bad-soft: #3a2020; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e151b; --surface: #151f28; --ink: #e4ebf1; --muted: #93a1ae; --line: #253240;
  --accent: #5cc0c6; --accent-ink: #082024; --accent-soft: #16343a; --specimen: #1a2631;
  --mark-nb: rgba(244,207,99,.45); --mark-nn: rgba(170,145,240,.5); --mark-th: rgba(110,200,160,.45);
  --shadow: 0 1px 2px rgba(0,0,0,.3); --s-oth: #7d8995; --s-lat: #6fa2f0; --s-hang: #ec79a9; --s-kana: #f0a659; --s-han: #a58ef0; --bad: #f08a80; --bad-soft: #3a2020; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
:lang(ja) { --f-sample: "IBM Plex Sans", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "IBM Plex Sans Thai", sans-serif; }
:lang(ko) { --f-sample: "IBM Plex Sans", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "IBM Plex Sans Thai", sans-serif; }
:lang(zh-Hans) { --f-sample: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "IBM Plex Sans Thai", sans-serif; }
:lang(zh-Hant) { --f-sample: "IBM Plex Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "IBM Plex Sans Thai", sans-serif; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
a { color: var(--accent); }

.wrap { max-width: 1480px; margin: 0 auto; padding: 0 24px; }

/* Header */
.top { padding: 28px 0 0; }
.title-row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; }
.brand h1 { font: 700 30px/1.15 var(--f-display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.brand p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { position: relative; }
.search input {
  width: 300px; max-width: 100%; height: 40px; padding: 0 40px 0 38px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit;
}
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 12px; top: 12px; width: 16px; height: 16px; color: var(--muted); }
.search kbd { position: absolute; right: 10px; top: 9px; font: 500 12px/20px var(--f-mono); padding: 0 6px; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); }
.langsw { display: inline-flex; height: 40px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); gap: 2px; }
.langsw button { border: 0; background: none; border-radius: 7px; padding: 0 12px; cursor: pointer; color: var(--muted); font-weight: 500; min-width: 44px; }
.langsw button:hover { color: var(--ink); }
.langsw button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.toggle { display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; user-select: none; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.switch { width: 30px; height: 18px; border-radius: 99px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.toggle input:checked + .switch { background: var(--accent); }
.toggle input:checked + .switch::after { transform: translateX(12px); }
.toggle input:focus-visible + .switch { outline: 2px solid var(--accent); outline-offset: 2px; }

.meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 18px 0 0; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 13px; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 600; }
.meta .sample { font-family: var(--f-mono); color: var(--ink); }
.legend { display: inline-flex; gap: 12px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 12px; border-radius: 3px; display: inline-block; }

/* Tabs */
.tabs { display: flex; gap: 4px; margin: 20px 0 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; padding: 10px 14px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tab .code { font: 600 11px/1 var(--f-mono); padding: 4px 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); }
.tab[aria-selected="true"] .code { background: var(--accent); color: var(--accent-ink); }
.tab .nat { font-family: var(--f-sample); }
.tab-sep { width: 1px; background: var(--line); margin: 10px 6px; flex: none; }

/* Layout */
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; padding: 24px 0 64px; }
.rail { position: sticky; top: 16px; align-self: start; display: grid; gap: 2px; }
.rail .rail-h { font-size: 12px; color: var(--muted); padding: 0 10px 6px; }
.rail button { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 8px; cursor: pointer; color: var(--muted); }
.rail button:hover { background: var(--surface); color: var(--ink); }
.rail button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
.rail .cnt { font: 500 12px var(--f-mono); color: var(--muted); }
.rail button.empty { opacity: .4; }

.sec { scroll-margin-top: 16px; margin-bottom: 36px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; }
.sec-h h2 { font: 600 20px/1.3 var(--f-display); margin: 0; }
.sec-h .en { color: var(--muted); font-size: 13px; }

/* Compare table */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
table.cmp { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1240px; table-layout: fixed; }
.cmp col.c-label { width: 200px; }
.cmp th, .cmp td { text-align: left; vertical-align: top; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.cmp tr:last-child > * { border-bottom: 0; }
.cmp thead th { position: sticky; top: 0; background: var(--surface); font-weight: 600; font-size: 13px; padding-top: 10px; padding-bottom: 10px; z-index: 1; }
.cmp thead th button { border: 0; background: none; padding: 0; cursor: pointer; display: inline-flex; align-items: baseline; gap: 8px; }
.cmp thead th button:hover .nat { text-decoration: underline; }
.cmp thead .code { font: 600 11px/1 var(--f-mono); padding: 4px 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); }
.cmp thead .nat { font-family: var(--f-sample); font-weight: 500; }
.cmp th:first-child, .cmp td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 2; box-shadow: 1px 0 0 var(--line); }
.cmp thead th:first-child { z-index: 3; color: var(--muted); font-weight: 500; }
.cmp tbody tr:hover > * { background: var(--specimen); }
.cmp tbody tr:hover .val { background: var(--surface); }

.rlabel { font-weight: 600; line-height: 1.4; }
.ren { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.src { display: inline-block; margin-top: 6px; font: 500 10.5px/1 var(--f-mono); letter-spacing: .02em; padding: 3px 6px; border-radius: 4px; }
.src.cldr { background: var(--accent-soft); color: var(--accent); }
.src.style { border: 1px solid var(--line); color: var(--muted); }
.common { display: block; font-size: 12.5px; color: var(--muted); margin-top: 6px; line-height: 1.5; }

.val {
  display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--specimen);
  border-radius: 8px; padding: 7px 10px; cursor: copy; font-family: var(--f-sample); font-size: 15px; line-height: 1.5;
  white-space: pre-line; overflow-wrap: break-word; font-variant-numeric: tabular-nums; position: relative; transition: border-color .12s;
}
.val:hover { border-color: var(--accent); }
.val.list { display: flex; flex-wrap: wrap; gap: 4px; white-space: normal; }
.chip { font-size: 13px; padding: 1px 7px; border-radius: 5px; background: var(--surface); border: 1px solid var(--line); }
.desc { font-size: 14px; line-height: 1.5; white-space: pre-line; overflow-wrap: anywhere; }
.desc:lang(ja), .desc:lang(ko), .desc:lang(zh-Hans), .desc:lang(zh-Hant) { font-family: var(--f-sample); }
.pat { display: inline-block; margin-top: 6px; font: 12px/1.4 var(--f-mono); color: var(--muted); background: transparent; border: 1px dashed var(--line); border-radius: 5px; padding: 1px 6px; }
.note { display: block; font-size: 12.5px; color: var(--muted); margin-top: 6px; line-height: 1.5; white-space: pre-line; }
.val.list.ord { flex-direction: column; align-items: flex-start; }
.chip i { font: 500 10.5px var(--f-mono); color: var(--muted); font-style: normal; margin-right: 5px; }

/* Invisible characters */
.inv { border-radius: 2px; }
body.show-inv .inv { padding: 0 1px; }
body.show-inv .inv-nb { background: var(--mark-nb); }
body.show-inv .inv-nn { background: var(--mark-nn); }
body.show-inv .inv-th { background: var(--mark-th); }
body:not(.show-inv) .legend { display: none; }

/* Language view */
.hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; box-shadow: var(--shadow); margin-bottom: 20px; }
.hero-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.hero-top .big { font: 600 40px/1.1 var(--f-sample); letter-spacing: -.01em; }
.hero-top .tag { font: 600 13px var(--f-mono); padding: 4px 8px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); }
.hero-top .sub { color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.fact { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--specimen); }
.fact .k { font-size: 12px; color: var(--muted); }
.fact .v { font-weight: 600; margin-top: 2px; line-height: 1.4; }
.checks { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 12px; background: var(--surface); padding: 18px 22px; margin-bottom: 28px; }
.checks h2 { font: 600 17px/1.3 var(--f-display); margin: 0 0 10px; }
.checks ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.checks li { max-width: 90ch; }
.checks li::marker { font: 600 13px var(--f-mono); color: var(--accent); }

.rows { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
.row { display: grid; grid-template-columns: 240px minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .detail .pat { margin-top: 0; margin-right: 6px; }
.row .detail .note:first-child { margin-top: 0; }

/* Special letters */
.chars-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.cpanel { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); padding: 18px 20px 20px; display: grid; gap: 18px; align-content: start; }
.cpanel-h { display: flex; align-items: baseline; gap: 10px; }
.cpanel-h .code { font: 600 11px/1 var(--f-mono); padding: 4px 6px; border-radius: 5px; background: var(--accent); color: var(--accent-ink); }
.cpanel-h .nat { font: 600 18px/1.2 var(--f-display); }
.cpanel-h .cnt { margin-left: auto; font: 500 12px var(--f-mono); color: var(--muted); }
.samples { display: grid; gap: 8px; }
.samples .k { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.cgroup-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 8px; }
.cgroup-h h3 { font: 600 15px/1.3 var(--f-body); margin: 0; }
.cgroup-h span { font-size: 12.5px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 6px; align-content: start; }
.glyphs { display: flex; gap: 6px; }
.gl { flex: 1; min-width: 0; height: 58px; border: 1px solid var(--line); border-radius: 8px; background: var(--specimen); cursor: copy; font: 500 30px/1 var(--f-sample); transition: border-color .12s; }
.gl:hover { border-color: var(--accent); }
.tile .cp { font: 11.5px/1.5 var(--f-mono); color: var(--muted); }
.tile .ex { font-size: 14px; }
.tile .moj { font: 11.5px/1.5 var(--f-mono); color: var(--muted); }
.tile .moj b { color: var(--ink); font-weight: 500; }
.tile .note { margin-top: 0; }
.cqa { border-top: 1px solid var(--line); padding-top: 14px; }
.cqa h3 { font: 600 15px/1.3 var(--f-body); margin: 0 0 8px; }
.cqa ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; font-size: 14px; }
.cqa li::marker { font: 600 12px var(--f-mono); color: var(--accent); }
.chars-foot { font-size: 13px; color: var(--muted); margin-top: 10px; }

/* Sorting demo */
.sortdemo { margin-top: 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); padding: 20px; display: grid; gap: 16px; }
.sortdemo h3 { font: 600 17px/1.3 var(--f-display); margin: 0; text-wrap: balance; }
.sortdemo .lead { margin: 4px 0 0; color: var(--muted); font-size: 14px; max-width: 80ch; }
.sd-input { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sd-input .k { font-size: 12px; color: var(--muted); margin-right: 4px; }
.fn { display: inline-flex; align-items: center; gap: 6px; font: 13px/1.4 var(--f-sample); padding: 3px 8px 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--specimen); white-space: nowrap; }
.fn::before { content: ""; width: 4px; align-self: stretch; border-radius: 2px; background: var(--sc); }
.s-oth { --sc: var(--s-oth); } .s-lat { --sc: var(--s-lat); } .s-hang { --sc: var(--s-hang); } .s-kana { --sc: var(--s-kana); } .s-han { --sc: var(--s-han); }
.sd-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); }
.sd-legend span { display: inline-flex; align-items: center; gap: 6px; }
.sd-legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--sc); }
.sd-cols-wrap { overflow-x: auto; }
.sd-cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(168px, 1fr); gap: 10px; min-width: min-content; }
.sd-col { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; align-content: start; background: var(--surface); }
.sd-col.bad { border-color: var(--bad); background: var(--bad-soft); }
.sd-col-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
.sd-col-h b { font-size: 14px; line-height: 1.3; }
.sd-col-h .sub { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
.sd-col.bad .sub { color: var(--bad); }
.sd-copy { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; font-size: 12px; padding: 2px 8px; cursor: pointer; flex: none; }
.sd-copy:hover { border-color: var(--accent); color: var(--accent); }
.sd-col ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; counter-reset: n; }
.sd-col li { counter-increment: n; display: flex; align-items: center; gap: 6px; }
.sd-col li::before { content: counter(n); font: 10.5px var(--f-mono); color: var(--muted); width: 16px; text-align: right; flex: none; }
.sd-col li .fn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sd-flow { font-size: 12px; color: var(--muted); line-height: 1.45; }
.sd-bottom { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 16px; }
.sd-nat { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; align-content: start; }
.sd-nat h4, .sd-qa h4 { margin: 0; font: 600 15px/1.3 var(--f-body); }
.sd-nat .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sd-nat .pair > div { display: grid; gap: 4px; align-content: start; }
.sd-nat .k { font-size: 12px; color: var(--muted); }
.sd-qa { border-top: 0; }
.sd-qa ol { margin: 8px 0 0; padding-left: 22px; display: grid; gap: 6px; font-size: 14px; }
.sd-qa li::marker { font: 600 12px var(--f-mono); color: var(--accent); }
@media (max-width: 960px) { .sd-bottom { grid-template-columns: minmax(0, 1fr); } }

/* Character test data */
.td-hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); align-items: start; }
.td-h { font: 600 26px/1.2 var(--f-display); margin: 0 0 6px; }
.lead { color: var(--muted); margin: 0; max-width: 70ch; }
.gloss { display: grid; gap: 6px; margin: 0; }
.gloss div { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; font-size: 13.5px; }
.gloss dt { font: 500 12.5px/1.6 var(--f-mono); color: var(--accent); }
.gloss dd { margin: 0; color: var(--muted); }
.counter-card { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); padding: 18px 20px; display: grid; gap: 14px; }
.counter-card textarea { width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--specimen); color: var(--ink); font: 16px/1.6 var(--f-sample); }
.counter-card textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#tdResult { display: grid; gap: 12px; }
.metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.metric { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--specimen); display: grid; gap: 2px; }
.metric .k { font: 500 12px var(--f-mono); color: var(--muted); }
.metric .v { font: 600 26px/1.15 var(--f-mono); font-variant-numeric: tabular-nums; }

const MARKS = { "\u0300": "grave", "\u0301": "acute", "\u0302": "circumflex", "\u0308": "diaeresis", "\u0327": "cedilla" };

}
function charMatches(ch, grp) {

  if (!("IntersectionObserver" in window)) return;
  const btns = [...document.querySelectorAll("#rail button")];
  const setOn = id => btns.forEach(b => b.classList.toggle("on", b.dataset.cat === id));
  const first = document.querySelector("#main .sec"); if (first) setOn(first.dataset.cat);
  observer = new IntersectionObserver(es => {
    const vis = es.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
    if (vis) setOn(vis.target.dataset.cat);
  }, { rootMargin: "-10% 0px -70% 0px" });
  document.querySelectorAll("#main .sec").forEach(s => observer.observe(s));
}

const validView = v => v === "compare" || v === "testdata" || LOCS.some(l => l.id === v);
function setView(v, push = true) {
  if (!validView(v)) v = "compare";
  view = v;
  if (push && location.hash.slice(1) !== v) { try { history.pushState(null, "", "#" + v); } catch (e) { location.hash = v; } }
  render();
  window.scrollTo({ top: 0 });
}

let toastT;
function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1800);
}
async function copy(text) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    try { const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); ta.remove(); } catch (e2) { ok = false; }
  }
  const special = /[\u00A0\u202F\u2009]/.test(text) ? u("special") : "";
  toast(ok ? `${u("copied")} ${text.split("\n")[0]}${text.includes("\n") ? " …" : ""}${special}` : u("copyFail"));
}

document.addEventListener("click", e => {
  const ui = e.target.closest("[data-ui]"); if (ui) { setUI(ui.dataset.ui); return; }
  const v = e.target.closest("[data-view]"); if (v) { setView(v.dataset.view); return; }
  const c = e.target.closest("[data-copy]"); if (c) { copy(c.dataset.copy); return; }
  const r = e.target.closest("#rail button"); if (r) { const s = document.getElementById("sec-" + r.dataset.cat); if (s) s.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); }
});
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim(); render(); });
document.getElementById("inv").addEventListener("change", e => document.body.classList.toggle("show-inv", e.target.checked));
document.addEventListener("keydown", e => {
  if (e.key === "/" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) { e.preventDefault(); document.getElementById("q").focus(); }
  if (e.key === "Escape" && document.activeElement.id === "q") { e.target.value = ""; query = ""; render(); }
});
document.getElementById("tabs").addEventListener("keydown", e => {
  if (!["ArrowRight", "ArrowLeft"].includes(e.key)) return;
  const ids = ["compare", ...LOCS.map(l => l.id), "testdata"]; let i = ids.indexOf(view);
  i = (i + (e.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length; setView(ids[i]);
  document.querySelector(`.tab[data-view="${ids[i]}"]`).focus();
});
const onNav = () => { const v = location.hash.slice(1) || "compare"; if (v !== view) setView(v, false); };
window.addEventListener("hashchange", onNav);
window.addEventListener("popstate", onNav);
view = location.hash.slice(1) || "compare";
if (!validView(view)) view = "compare";
applyStatic();
render();
</script>
</body>
