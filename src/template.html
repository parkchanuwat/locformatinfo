<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locale Format Reference · Adobe Style Guides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&family=Noto+Sans+KR:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* A QA reference tool: tabs on top (compare all / one language), sticky category rail on the left,
     samples as copyable "specimen" buttons, every value tagged with the PDF page it comes from. */
  --bg: #f3f5f7;
  --surface: #ffffff;
  --ink: #15212d;
  --muted: #5b6876;
  --line: #dce2e8;
  --accent: #0e6870;
  --accent-ink: #ffffff;
  --accent-soft: #e0eff0;
  --specimen: #f7f9fa;
  --mark-nb: #f4cf63;
  --bad: #b4382f; --bad-soft: #fbeceb;
  --warn: #8a5a00; --warn-soft: #fdf3dc;
  --shadow: 0 1px 2px rgba(21,33,45,.06), 0 4px 16px rgba(21,33,45,.05);
  --f-display: "Anuphan", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Thai", "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --f-sample: "IBM Plex Sans", "IBM Plex Sans Thai", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e151b; --surface: #151f28; --ink: #e4ebf1; --muted: #93a1ae; --line: #253240;
    --accent: #5cc0c6; --accent-ink: #082024; --accent-soft: #16343a; --specimen: #1a2631;
    --mark-nb: rgba(244,207,99,.45); --bad: #f08a80; --bad-soft: #3a2020; --warn: #f0c66e; --warn-soft: #3a3020;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
:lang(ja) { --f-sample: "IBM Plex Sans", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "IBM Plex Sans Thai", sans-serif; }
:lang(ko) { --f-sample: "IBM Plex Sans", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "IBM Plex Sans Thai", sans-serif; }
:lang(zh-Hans) { --f-sample: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "IBM Plex Sans Thai", sans-serif; }
:lang(zh-Hant) { --f-sample: "IBM Plex Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "IBM Plex Sans Thai", sans-serif; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
a { color: var(--accent); }

.wrap { max-width: 1480px; margin: 0 auto; padding: 0 24px; }

/* Header */
.top { padding: 28px 0 0; }
.title-row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; }
.brand h1 { font: 700 30px/1.15 var(--f-display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.brand p { margin: 6px 0 0; color: var(--muted); max-width: 66ch; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { position: relative; }
.search input {
  width: 300px; max-width: 100%; height: 40px; padding: 0 40px 0 38px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit;
}
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 12px; top: 12px; width: 16px; height: 16px; color: var(--muted); }
.search kbd { position: absolute; right: 10px; top: 9px; font: 500 12px/20px var(--f-mono); padding: 0 6px; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); }
.langsw { display: inline-flex; height: 40px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); gap: 2px; }
.langsw button { border: 0; background: none; border-radius: 7px; padding: 0 12px; cursor: pointer; color: var(--muted); font-weight: 500; min-width: 44px; }
.langsw button:hover { color: var(--ink); }
.langsw button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.toggle { display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; user-select: none; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.switch { width: 30px; height: 18px; border-radius: 99px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.toggle input:checked + .switch { background: var(--accent); }
.toggle input:checked + .switch::after { transform: translateX(12px); }
.toggle input:focus-visible + .switch { outline: 2px solid var(--accent); outline-offset: 2px; }

.meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 18px 0 0; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 13px; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 600; }
.legend { display: inline-flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 12px; border-radius: 3px; display: inline-block; background: var(--mark-nb); }
body:not(.show-inv) .legend .lg-nb { display: none; }

/* Tabs */
.tabs { display: flex; gap: 4px; margin: 20px 0 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; padding: 10px 14px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tab .code { font: 600 11px/1 var(--f-mono); padding: 4px 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); }
.tab[aria-selected="true"] .code { background: var(--accent); color: var(--accent-ink); }
.tab .nat { font-family: var(--f-sample); }
.tab-sep { width: 1px; background: var(--line); margin: 10px 6px; flex: none; }

/* Layout */
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; padding: 24px 0 64px; }
.rail { position: sticky; top: 16px; align-self: start; display: grid; gap: 2px; }
.rail .rail-h { font-size: 12px; color: var(--muted); padding: 0 10px 6px; }
.rail button { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 8px; cursor: pointer; color: var(--muted); }
.rail button:hover { background: var(--surface); color: var(--ink); }
.rail button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
.rail .cnt { font: 500 12px var(--f-mono); color: var(--muted); }

.sec { scroll-margin-top: 16px; margin-bottom: 36px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; }
.sec-h h2 { font: 600 20px/1.3 var(--f-display); margin: 0; }
.sec-h .en { color: var(--muted); font-size: 13px; }

/* Compare table */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
table.cmp { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1180px; table-layout: fixed; }
.cmp col.c-label { width: 190px; }
.cmp th, .cmp td { text-align: left; vertical-align: top; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.cmp tr:last-child > * { border-bottom: 0; }
.cmp thead th { position: sticky; top: 0; background: var(--surface); font-weight: 600; font-size: 13px; padding-top: 10px; padding-bottom: 10px; z-index: 1; }
.cmp thead th button { border: 0; background: none; padding: 0; cursor: pointer; display: inline-flex; align-items: baseline; gap: 8px; }
.cmp thead th button:hover .nat { text-decoration: underline; }
.cmp thead .code { font: 600 11px/1 var(--f-mono); padding: 4px 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); }
.cmp thead .nat { font-family: var(--f-sample); font-weight: 500; }
.cmp th:first-child, .cmp td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 2; box-shadow: 1px 0 0 var(--line); }
.cmp thead th:first-child { z-index: 3; color: var(--muted); font-weight: 500; }
.cmp tbody tr:hover > * { background: var(--specimen); }
.cmp tbody tr:hover .val { background: var(--surface); }

.rlabel { font-weight: 600; line-height: 1.4; }
.ren { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }

.vals { display: grid; gap: 4px; }
.val {
  display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--specimen);
  border-radius: 8px; padding: 6px 10px; cursor: copy; font-family: var(--f-sample); font-size: 15px; line-height: 1.5;
  white-space: pre-line; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; transition: border-color .12s;
}
.val:hover { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips .val { width: auto; padding: 3px 8px; font-size: 14px; }
.xs { display: flex; flex-wrap: wrap; gap: 4px; align-items: baseline; margin-top: 6px; }
.xs .xk { font: 600 11px/1 var(--f-mono); color: var(--bad); }
.xv { font: 13px/1.45 var(--f-sample); padding: 1px 6px; border-radius: 5px; background: var(--bad-soft); color: var(--bad); text-decoration: line-through; text-decoration-thickness: 1px; overflow-wrap: anywhere; white-space: pre-line; }
.rule { display: block; font-size: 12.5px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
.rule.lead { margin-top: 0; color: var(--ink); font-size: 13.5px; }
.warn { display: block; font-size: 12.5px; line-height: 1.5; margin-top: 6px; padding: 5px 8px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); }
.warn::before { content: "⚠ "; }
.na { display: inline-block; font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; padding: 3px 8px; }
.none { color: var(--line); font-size: 18px; line-height: 1; }
.pg { display: inline-block; margin-top: 6px; font: 500 10.5px/1 var(--f-mono); letter-spacing: .02em; padding: 3px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); cursor: help; white-space: nowrap; }
.pg b { font-weight: 600; color: var(--accent); }

/* Invisible characters */
.inv { border-radius: 2px; }
body.show-inv .inv { padding: 0 1px; }
body.show-inv .inv-nb { background: var(--mark-nb); }

/* Language view */
.hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; box-shadow: var(--shadow); margin-bottom: 20px; }
.hero-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.hero-top .big { font: 600 40px/1.1 var(--f-sample); letter-spacing: -.01em; }
.hero-top .tag { font: 600 13px var(--f-mono); padding: 4px 8px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); }
.hero-top .sub { color: var(--muted); }
.hero-src { font-size: 13px; color: var(--muted); margin: -6px 0 0; }
.hero-src code { font: 12px var(--f-mono); color: var(--ink); }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.fact { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--specimen); }
.fact .k { font-size: 12px; color: var(--muted); }
.fact .v { font-weight: 600; margin-top: 2px; line-height: 1.4; font-family: var(--f-sample); overflow-wrap: anywhere; }
.checks { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 12px; background: var(--surface); padding: 18px 22px; margin-bottom: 28px; }
.checks h2 { font: 600 17px/1.3 var(--f-display); margin: 0 0 10px; }
.checks ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.checks li { max-width: 92ch; }
.checks li::marker { font: 600 13px var(--f-mono); color: var(--accent); }
.checks .pg { margin: 0 0 0 6px; vertical-align: 1px; }

.rows { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
.row { display: grid; grid-template-columns: 220px minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .detail .pg { margin-top: 8px; }
.row.empty-row { color: var(--muted); }

.empty-state { padding: 48px 24px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; }

footer { border-top: 1px solid var(--line); padding: 20px 0 40px; color: var(--muted); font-size: 13px; }
footer h2 { font: 600 15px/1.3 var(--f-display); color: var(--ink); margin: 0 0 8px; }
footer p { margin: 0 0 12px; max-width: 110ch; }
.srcs { border-collapse: collapse; width: 100%; margin: 6px 0 16px; font-size: 13px; }
.srcs th, .srcs td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.srcs th { color: var(--muted); font-weight: 500; font-size: 12px; }
.srcs td { color: var(--ink); }
.srcs code { font: 12px var(--f-mono); overflow-wrap: anywhere; }
.srcs-wrap { overflow-x: auto; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; transition: opacity .15s, transform .15s; max-width: calc(100% - 32px); z-index: 10; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-top: 12px; }
  .rail { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; background: var(--bg); scrollbar-width: none; }
  .rail .rail-h { display: none; }
  .rail button { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; }
  .rail button.on { box-shadow: none; border-color: var(--accent); }
  .sec { scroll-margin-top: 64px; }
  .row { grid-template-columns: minmax(0, 1fr); gap: 8px; }
}
@media (max-width: 560px) {
  .wrap { padding: 0 16px; }
  .brand h1 { font-size: 24px; }
  .search, .search input { width: 100%; }
  .tools { width: 100%; }
  .hero-top .big { font-size: 32px; }
  .hero { padding: 18px; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cmp col.c-label { width: 140px; }
  table.cmp { min-width: 1060px; }
  .cmp th, .cmp td { padding: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="title-row">
      <div class="brand">
        <h1>Locale Format Reference</h1>
        <p id="subtitle"></p>
      </div>
      <div class="tools">
        <div class="langsw" role="group" id="langsw">
          <button type="button" data-ui="th" lang="th">ไทย</button>

          <input id="q" type="search" autocomplete="off">
          <kbd aria-hidden="true">/</kbd>
        </label>
        <label class="toggle" for="inv">
          <input id="inv" type="checkbox" checked>
          <span class="switch" aria-hidden="true"></span>
          <span id="invLabel"></span>
        </label>
      </div>
    </div>
    <div class="meta">
      <span id="metaData"></span>

        <span class="lg-nb"><i></i>NBSP U+00A0</span>

        <span><span class="pg"><b>p.</b>38</span><span id="lgPage"></span></span>
      </span>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </header>

  <div class="layout">
    <nav class="rail" id="rail"></nav>
    <main id="main"></main>
  </div>

  <footer id="foot"></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

    subtitle: "Date, time, number, currency, punctuation and UI text formats in 6 languages, taken only from the Adobe Localization Style Guides. Every value cites its PDF page. Click a sample to copy it with its exact characters.",
    searchPh: "Search, e.g. currency, «, Ctrl", searchAria: "Search items", inv: "Show NBSP", langAria: "Page language",
    data: "Data: 6 <b>Adobe Localization Style Guide</b> PDFs", lgBad: "Form the guide marks as incorrect", lgPage: "PDF page",
    tabsAria: "Views", railAria: "Categories", railHead: "Categories", tabCompare: "Compare all languages", colItem: "Item",
    viewAll: l => `View all of ${l.en}`, heroSub: l => l.en, heroAria: "Summary", checks: "What to check when reviewing",
    empty: q => `Nothing matches “${q}”. Try another term or clear the search.`,
    none: "Not covered by this guide", page: "page", wrong: "Wrong",
    copied: "Copied:", special: " (includes NBSP)", copyFail: "Couldn't copy. Select the text and press Ctrl+C.", copy: "Copy",
    srcHead: "Sources", srcCols: ["Language", "Document", "Version", "Date", "File"],
    footNote: "Everything on this page is summarized from the PDFs listed below and nothing else. Samples are copied as the guides write them (… marks omitted text, → shows a substitution from the guide's table); rules are paraphrased. A — means the guide doesn't cover the topic. A ⚠ means the guide contradicts itself; ask the IPM before logging a bug. The PDFs don't encode no-break spaces as characters, so this page inserts NBSP wherever a language's rules call for one. If a product has its own style guide or IPM instructions that differ, follow those first.",
    removed: "Topics from the previous version that the PDFs don't cover have been removed: CLDR-generated values (time zone names, relative time, first day of week, week numbering, scientific notation, language names), the collation sorting tables, the DE/FR special-letter panels and the character test data page."
  }
};
let uiLang = "th";
try { const s = localStorage.getItem("lfr-ui-lang"); if (s === "en" || s === "th") uiLang = s; } catch (e) {}
const u = k => UI[uiLang][k];
const L = o => o ? (uiLang === "en" ? o.en : o.th) : "";

function applyStatic() {
  document.documentElement.lang = uiLang;
  document.getElementById("subtitle").textContent = u("subtitle");
  const q = document.getElementById("q"); q.placeholder = u("searchPh"); q.setAttribute("aria-label", u("searchAria"));
  document.getElementById("invLabel").textContent = u("inv");
  document.getElementById("metaData").innerHTML = u("data");
  document.getElementById("lgBad").textContent = u("lgBad");
  document.getElementById("lgPage").textContent = u("lgPage");
  document.getElementById("tabs").setAttribute("aria-label", u("tabsAria"));
  document.getElementById("rail").setAttribute("aria-label", u("railAria"));
  const sw = document.getElementById("langsw"); sw.setAttribute("aria-label", u("langAria"));
  sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.ui === uiLang)));
  renderFooter();
}
function setUI(l) {
  if (l === uiLang) return;
  uiLang = l;
  try { localStorage.setItem("lfr-ui-lang", l); } catch (e) {}
  applyStatic(); render();
}

// ---------- helpers ----------
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = s => esc(s).replace(/ /g, `<span class="inv inv-nb" title="U+00A0 NO-BREAK SPACE"> </span>`);
const arr = s => s == null ? [] : (Array.isArray(s) ? s : [s]);
const itemName = it => uiLang === "en" ? it.en : it.th;
const catName = c => uiLang === "en" ? c.en : c.th;
ITEMS.forEach((it, i) => { it.id = "i" + i; });

function pageTag(loc, p) {
  if (p == null) return "";
  const src = SOURCES[loc.id];
  return `<span class="pg" title="${esc(src.file)} · ${esc(u("page"))} ${esc(p)}"><b>p.</b>${esc(p)}</span>`;
}
function samplesHTML(cell, loc) {
  const s = arr(cell.s);
  if (!s.length) return "";
  const btn = v => `<button class="val" type="button" lang="${loc.lang}" data-copy="${esc(v)}" aria-label="${esc(u("copy"))} ${esc(v)}">${fmt(v)}</button>`;
  const short = s.length > 1 && s.every(v => [...v].length <= 14 && !v.includes("\n"));
  return short ? `<div class="chips">${s.map(btn).join("")}</div>` : `<div class="vals">${s.map(btn).join("")}</div>`;
}
function wrongHTML(cell, loc) {
  const x = arr(cell.x);
  return x.length ? `<div class="xs"><span class="xk">✗ ${esc(u("wrong"))}</span>${x.map(v => `<span class="xv" lang="${loc.lang}">${fmt(v)}</span>`).join("")}</div>` : "";
}
function ruleHTML(cell, lead) {
  const parts = [];
  if (cell.na) parts.push(`<span class="na">${esc(L(cell.na))}</span>`);
  if (cell.r) parts.push(`<span class="rule${lead && !cell.na ? " lead" : ""}">${fmt(L(cell.r))}</span>`);
  if (cell.w) parts.push(`<span class="warn">${fmt(L(cell.w))}</span>`);
  return parts.join("");
}
const noneHTML = () => `<span class="none" title="${esc(u("none"))}" aria-label="${esc(u("none"))}">—</span>`;

// Compare view: samples, then wrong forms, then the rule, then the page.
function cellCompare(item, loc) {
  const c = item.v[loc.id];
  if (!c) return noneHTML();
  return samplesHTML(c, loc) + wrongHTML(c, loc) + ruleHTML(c, !c.s) + pageTag(loc, c.p);
}

// ---------- search ----------
let view = "compare", query = "";
function cellText(c) {
  if (!c) return "";
  return [...arr(c.s), ...arr(c.x), c.r && c.r.th, c.r && c.r.en, c.w && c.w.th, c.w && c.w.en, c.na && c.na.th, c.na && c.na.en].filter(Boolean).join(" ").replace(/ /g, " ");
}
function matches(item, locs) {
  if (!query) return true;
  const q = query.toLowerCase();
  const hay = [item.th, item.en, ...locs.map(l => cellText(item.v[l.id]))].join(" ").toLowerCase();
  return hay.includes(q);
}

// ---------- views ----------
function renderTabs() {
  document.getElementById("tabs").innerHTML = `<button class="tab" role="tab" data-view="compare" aria-selected="${view === "compare"}">${u("tabCompare")}</button><span class="tab-sep" aria-hidden="true"></span>` +
    LOCS.map(l => `<button class="tab" role="tab" data-view="${l.id}" aria-selected="${view === l.id}"><span class="code">${l.short}</span><span class="nat" lang="${l.lang}">${l.native}</span></button>`).join("");
}
function renderRail(list) {
  document.getElementById("rail").innerHTML = `<div class="rail-h">${u("railHead")}</div>` + list.map(c =>
    `<button type="button" data-cat="${c.id}"><span>${esc(c.name)}</span><span class="cnt">${c.n}</span></button>`).join("");
}
const secHead = cat => `<div class="sec-h"><h2>${esc(catName(cat))}</h2>${uiLang === "en" ? "" : `<span class="en">${esc(cat.en)}</span>`}</div>`;
const labelHTML = item => `<div class="rlabel">${esc(itemName(item))}</div>${uiLang === "en" ? "" : `<span class="ren">${esc(item.en)}</span>`}`;

function renderCompare() {
  const counts = {}; let html = "";
  for (const cat of CATS) {
    const rows = ITEMS.filter(i => i.cat === cat.id && matches(i, LOCS));
    if (!rows.length) continue;
    counts[cat.id] = rows.length;
    html += `<section class="sec" id="sec-${cat.id}" data-cat="${cat.id}">${secHead(cat)}
      <div class="tbl-wrap"><table class="cmp"><colgroup><col class="c-label">${LOCS.map(() => "<col>").join("")}</colgroup>
      <thead><tr><th scope="col">${u("colItem")}</th>${LOCS.map(l => `<th scope="col"><button type="button" data-view="${l.id}" title="${esc(u("viewAll")(l))}"><span class="code">${l.short}</span><span class="nat" lang="${l.lang}">${l.native}</span></button></th>`).join("")}</tr></thead>
      <tbody>${rows.map(it => `<tr><th scope="row">${labelHTML(it)}</th>${LOCS.map(l => `<td>${cellCompare(it, l)}</td>`).join("")}</tr>`).join("")}</tbody>
      </table></div></section>`;
  }
  return { html, counts };
}

function renderLang(loc) {
  const counts = {}; const src = SOURCES[loc.id];
  const facts = ITEMS.filter(i => i.cat === "overview").map(i => {
    const c = i.v[loc.id];
    return `<div class="fact"><div class="k">${esc(itemName(i))}</div><div class="v" lang="${loc.lang}">${c ? fmt(arr(c.s).join(" · ")) : "—"}</div></div>`;
  }).join("");
  let html = query ? "" : `<section class="hero" aria-label="${u("heroAria")}">
      <div class="hero-top"><span class="big" lang="${loc.lang}">${loc.native}</span><span class="tag">${loc.tag}</span><span class="sub">${esc(u("heroSub")(loc))}</span></div>
      <p class="hero-src">${esc(src.title)} · v${esc(src.ver)} · ${esc(src.date)} · <code>${esc(src.file)}</code>${loc.extra ? `<br>${esc(L(loc.extra))}` : ""}</p>
      <div class="facts">${facts}</div></section>
    <section class="checks"><h2>${u("checks")}</h2><ol>${CHECKS[loc.id].map(c => `<li><span lang="${uiLang}">${fmt(L(c))}</span>${pageTag(loc, c.p)}</li>`).join("")}</ol></section>`;
  for (const cat of CATS) {
    if (cat.id === "overview") continue;
    const rows = ITEMS.filter(i => i.cat === cat.id && i.v[loc.id] && matches(i, [loc]));
    if (!rows.length) continue;
    counts[cat.id] = rows.length;
    html += `<section class="sec" id="sec-${cat.id}" data-cat="${cat.id}">${secHead(cat)}
      <div class="rows">${rows.map(it => {
        const c = it.v[loc.id];
        const left = samplesHTML(c, loc) + wrongHTML(c, loc);
        return `<div class="row"><div>${labelHTML(it)}</div><div>${left || ruleHTML(c, true)}</div><div class="detail">${left ? ruleHTML(c, false) : ""}${pageTag(loc, c.p)}</div></div>`;
      }).join("")}</div></section>`;
  }
  return { html, counts };
}

function renderFooter() {
  document.getElementById("foot").innerHTML = `<h2>${u("srcHead")}</h2><p>${esc(u("footNote"))}</p>
    <div class="srcs-wrap"><table class="srcs"><thead><tr>${u("srcCols").map(c => `<th scope="col">${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${LOCS.map(l => { const s = SOURCES[l.id]; return `<tr><td>${esc(l.tag)}</td><td>${esc(s.title)}${l.extra ? `<br><span class="rule">${esc(L(l.extra))}</span>` : ""}</td><td>${esc(s.ver)}</td><td>${esc(s.date)}</td><td><code>${esc(s.file)}</code></td></tr>`; }).join("")}</tbody></table></div>
    <p>${esc(u("removed"))}</p>`;
}

let observer;
function render() {
  renderTabs();
  const loc = LOCS.find(l => l.id === view);
  const r = loc ? renderLang(loc) : renderCompare();
  const list = CATS.filter(c => c.id in r.counts).map(c => ({ id: c.id, name: catName(c), n: r.counts[c.id] }));
  document.getElementById("main").innerHTML = r.html.includes('class="sec') ? r.html : r.html + `<div class="empty-state">${esc(u("empty")(query))}</div>`;
  renderRail(list);
  spy();
}

function spy() {
  if (observer) observer.disconnect();
  if (!("IntersectionObserver" in window)) return;
  const btns = [...document.querySelectorAll("#rail button")];
  const setOn = id => btns.forEach(b => b.classList.toggle("on", b.dataset.cat === id));
  const first = document.querySelector("#main .sec"); if (first) setOn(first.dataset.cat);
  observer = new IntersectionObserver(es => {
    const vis = es.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
    if (vis) setOn(vis.target.dataset.cat);
  }, { rootMargin: "-10% 0px -70% 0px" });
  document.querySelectorAll("#main .sec").forEach(s => observer.observe(s));
}

const validView = v => v === "compare" || LOCS.some(l => l.id === v);
function setView(v, push = true) {
  if (!validView(v)) v = "compare";
  view = v;
  if (push && location.hash.slice(1) !== v) { try { history.replaceState(null, "", "#" + v); } catch (e) { location.hash = v; } }
  render();
  window.scrollTo({ top: 0 });
}

let toastT;
function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1800);
}
async function copy(text) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    try { const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); ta.remove(); } catch (e2) { ok = false; }
  }
  const special = / /.test(text) ? u("special") : "";
  toast(ok ? `${u("copied")} ${text.split("\n")[0]}${text.includes("\n") ? " …" : ""}${special}` : u("copyFail"));
}

document.addEventListener("click", e => {
  const ui = e.target.closest("[data-ui]"); if (ui) { setUI(ui.dataset.ui); return; }
  const v = e.target.closest("[data-view]"); if (v) { setView(v.dataset.view); return; }
  const c = e.target.closest("[data-copy]"); if (c) { copy(c.dataset.copy); return; }
  const r = e.target.closest("#rail button"); if (r) { const s = document.getElementById("sec-" + r.dataset.cat); if (s) s.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }
});
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim(); render(); });
document.getElementById("inv").addEventListener("change", e => document.body.classList.toggle("show-inv", e.target.checked));
document.addEventListener("keydown", e => {
  if (e.key === "/" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) { e.preventDefault(); document.getElementById("q").focus(); }
  if (e.key === "Escape" && document.activeElement.id === "q") { e.target.value = ""; query = ""; render(); }
});
document.getElementById("tabs").addEventListener("keydown", e => {
  if (!["ArrowRight", "ArrowLeft"].includes(e.key)) return;
  const ids = ["compare", ...LOCS.map(l => l.id)]; let i = ids.indexOf(view);
  i = (i + (e.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length; setView(ids[i]);
  document.querySelector(`.tab[data-view="${ids[i]}"]`).focus();
});
window.addEventListener("hashchange", () => setView(location.hash.slice(1) || "compare", false));
view = location.hash.slice(1) || "compare";
if (!validView(view)) view = "compare";
applyStatic();
render();
</script>
</body>
</html>
